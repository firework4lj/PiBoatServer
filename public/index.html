<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PiBoatServer</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >
    <link rel="stylesheet" href="/app.css">
  </head>
  <body>
    <main class="shell">
      <section class="map-region" aria-label="Boat map">
        <a class="map-link" href="/map.html">Open Track Map</a>
        <div id="map"></div>
      </section>

      <aside class="panel" aria-label="Boat status">
        <header class="topbar">
          <div>
            <p class="eyebrow">PiBoatServer</p>
            <h1 id="boatName">Boat</h1>
          </div>
          <div id="statusPill" class="status-pill">Waiting</div>
        </header>

        <dl class="stats">
          <div>
            <dt>Last Seen</dt>
            <dd id="lastSeen">--</dd>
          </div>
          <div>
            <dt>Position</dt>
            <dd id="position">--</dd>
          </div>
          <div>
            <dt>Speed</dt>
            <dd id="speed">--</dd>
          </div>
          <div>
            <dt>Cellular</dt>
            <dd id="cellular">--</dd>
          </div>
          <div>
            <dt>Signal</dt>
            <dd id="signal">--</dd>
          </div>
          <div>
            <dt>Audio</dt>
            <dd id="audioActivity">--</dd>
          </div>
          <div>
            <dt>Battery</dt>
            <dd id="battery">--</dd>
          </div>
          <div>
            <dt>Uptime</dt>
            <dd id="uptime">--</dd>
          </div>
        </dl>

        <section class="devices" aria-label="Devices">
          <h2>Devices</h2>
          <div id="devices"></div>
        </section>

        <section class="voltage-chart" aria-label="Battery voltage history">
          <div class="section-heading">
            <h2>Voltage</h2>
            <span id="voltageSummary">--</span>
          </div>
          <div class="range-tabs" id="voltageRanges" aria-label="Voltage history range">
            <button type="button" data-range-minutes="5">5m</button>
            <button type="button" data-range-minutes="30">30m</button>
            <button type="button" data-range-minutes="60">1h</button>
            <button type="button" data-range-minutes="180" class="active">3h</button>
            <button type="button" data-range-minutes="360">6h</button>
            <button type="button" data-range-minutes="720">12h</button>
            <button type="button" data-range-minutes="1440">1d</button>
            <button type="button" data-range-minutes="4320">3d</button>
            <button type="button" data-range-minutes="10080">7d</button>
          </div>
          <div class="chart-wrap">
            <canvas id="voltageChart" width="672" height="260"></canvas>
            <div id="voltageTooltip" class="chart-tooltip" hidden></div>
          </div>
          <div class="battery-insights" id="batteryInsights" aria-label="Battery insights">
            <div>
              <span>State</span>
              <strong id="batteryState">--</strong>
            </div>
            <div>
              <span>Trend</span>
              <strong id="batteryTrend">--</strong>
            </div>
            <div>
              <span>Charge Time</span>
              <strong id="batteryChargeTime">--</strong>
            </div>
            <div>
              <span>Best Charge</span>
              <strong id="batteryBestCharge">--</strong>
            </div>
          </div>
        </section>

        <section class="camera" aria-label="Camera">
          <div class="section-heading">
            <h2>Camera</h2>
            <span id="snapshotTime">--</span>
          </div>
          <button type="button" id="liveCameraButton" class="live-button">View Live</button>
          <img id="snapshot" alt="Latest boat camera snapshot">
        </section>
      </aside>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
